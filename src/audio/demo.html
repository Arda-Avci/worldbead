<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldBead Audio Demo</title>
    <style>
      body {
        background: #0a0e1a;
        color: #e8ecf7;
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8fa0c9;
        margin-top: 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        background: #1a2138;
        border: 1px solid #3a4a7a;
        color: #e8ecf7;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #26305a;
      }
      #status {
        color: #8fe0a0;
      }
    </style>
  </head>
  <body>
    <h1>WorldBead — Audio Engine Demo</h1>
    <p id="status">Tap any button to unlock audio, then try the sounds.</p>
    <div id="app"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
