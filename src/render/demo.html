<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Demo page lives under src/render/, but texture paths (and the main
         app's index.html) assume the site root; fix relative resolution
         here rather than in SpaceScene's own asset paths. -->
    <base href="/" />
    <title>SpaceScene demo</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; flex-wrap: wrap; gap: 4px; padding: 6px;
        background: rgba(0,0,0,0.35); font: 11px sans-serif;
      }
      #ui button {
        font: 11px sans-serif; padding: 4px 6px; background: #16233d; color: #cfe0ff;
        border: 1px solid #3a5488; border-radius: 4px;
      }
      #status {
        position: fixed; top: 4px; left: 4px; z-index: 10; color: #9fe; font: 11px monospace;
        background: rgba(0,0,0,0.4); padding: 3px 6px; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="status" data-status>loading</div>
    <div id="ui">
      <button data-planet="earth">Earth</button>
      <button data-planet="moon">Moon</button>
      <button data-planet="venus">Venus</button>
      <button data-planet="mars">Mars</button>
      <button data-shot="deepSpace">deepSpace</button>
      <button data-shot="sunPass">sunPass</button>
      <button data-shot="approach">approach</button>
      <button data-shot="gameplay">gameplay</button>
      <button data-shot="hero">hero</button>
      <button data-action="burst">burst</button>
      <button data-action="probe">probe</button>
      <button data-action="warp">warp</button>
      <button data-action="shake">shake</button>
      <button data-action="reveal">toggle reveal</button>
    </div>
    <script type="module" src="/src/render/demo.ts"></script>
  </body>
</html>
