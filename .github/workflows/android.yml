name: Android Debug Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldbead-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish latest debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk worldbead-debug.apk
          git tag -f latest-debug
          git push -f origin latest-debug

          # Same version scheme as vite.config.ts / build.gradle: v1.0.<N>
          # where N is the number of commits on main.
          N=$(git rev-list --count HEAD)
          SHA7=$(git rev-parse --short=7 HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%d)
          TITLE="WorldBead v1.0.${N} (latest debug)"
          NOTES="Version v1.0.${N}, commit ${SHA7}, built ${BUILD_DATE}."

          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --title "$TITLE" --notes "$NOTES"
          gh release edit latest-debug --title "$TITLE" --notes "$NOTES"
          gh release upload latest-debug worldbead-debug.apk#worldbead-debug.apk --clobber
